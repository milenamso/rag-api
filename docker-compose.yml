services:
  api:
    build: .
    image: rag-api:latest
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      RAG_CHROMA_MODE: http
      RAG_CHROMA_HOST: chroma
      RAG_CHROMA_PORT: "8000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  chroma-data:
